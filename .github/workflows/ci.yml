name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: clave-solo-para-ci
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cronogramas
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cronogramas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Instalar dependencias
        run: pip install -r requirements.lock
      - name: Revisar estilo
        run: |
          ruff check .
          ruff format --check .
      - name: Revisar configuración de Django
        run: python manage.py check
      - name: Revisar migraciones pendientes
        run: python manage.py makemigrations --check --dry-run
      - name: Ejecutar pruebas
        run: pytest
