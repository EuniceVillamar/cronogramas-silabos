[project]
name = "cronogramas-silabos"
version = "0.1.0"
description = "Extractor y organizador de cronogramas académicos a partir de sílabos en PDF."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "dateparser>=1.2,<2",
    "django-environ>=0.12,<1",
    "icalendar>=6,<7",
    "pdfplumber>=0.11,<0.12",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.11",
    "ruff>=0.11",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--cov=apps --cov=extractor --cov-report=term-missing"

[tool.coverage.run]
omit = ["*/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
