<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Cronogramas{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'inicio' %}">Cronogramas</a>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-3">
          {% csrf_token %}
          <span class="text-secondary">{{ user.username }}</span>
          <button class="btn btn-outline-secondary btn-sm" type="submit">Cerrar sesión</button>
        </form>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
