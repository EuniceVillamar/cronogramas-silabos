{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h1 class="h3 mb-3">Iniciar sesión</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary" type="submit">Entrar</button>
      </form>
      <p class="mt-3">¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
    </div>
  </div>
{% endblock %}
