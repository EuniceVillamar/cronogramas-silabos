{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
  <section class="pagina-formulario papel">
    <div class="contenedor">
      <div class="hoja">
        <div class="hoja__titulo">
          <h1>Iniciar sesión</h1>
          <p class="hoja__bajada">Entra para generar tu calendario y ver tu semana.</p>
        </div>
        <form method="post" class="formulario">
          {% csrf_token %}
          {{ form.as_p }}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="formulario__pie">
            <button class="boton" type="submit">Iniciar sesión</button>
            <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Crear cuenta</a></p>
          </div>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
