{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <h1 class="h3 mb-3">Crear cuenta</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Registrarme</button>
      </form>
      <p class="mt-3">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
    </div>
  </div>
{% endblock %}
